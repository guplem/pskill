name: Hosted viewer

# Publish the hosted viewer to GitHub Pages when main changes. Every merge to main is a release here, and the
# github-pages environment accepts the default branch only (not a tag).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # to publish the site
  id-token: write # to prove to Pages that this workflow publishes it

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.11"
      - name: Install the dev environment
        run: uv sync --locked
      - name: Build the site
        run: uv run python -m pskill_runner.hosted_site _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
