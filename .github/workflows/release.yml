name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub release and upload pskill.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.11"
      - name: Install the dev environment
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Check that the tag matches the runner version
        run: test "$GITHUB_REF_NAME" = "v$(uv run python -c 'import pskill_runner; print(pskill_runner.__version__)')"
      - name: Build the release archive
        run: uv run python -m pskill_runner.release dist/pskill.zip
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/pskill.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
