name: two clarification rounds, then a new issue with no label, because the user approved the draft
inputs: {description: The runner is slow.}
answers:
  assess_clarity:
    - {clear: false, question: "Which command is slow?", terms: [start, slow]}
    - {clear: false, question: "How slow, in seconds?", terms: [start, slow]}
    - {clear: true, terms: [start, slow]}
  ask_clarify:
    - {answer: pskill start., question: "Which command is slow?", $answered_by: human}
    - {answer: About 4 seconds., question: "How slow, in seconds?", $answered_by: human}
  judge_duplicates:
    - {choice: none, rationale: No issue talks about start time.}
  draft_issue:
    - {title: pskill start takes 4 seconds, body: "**TL;DR:** ..."}
  confirm_draft:
    - {choice: create, rationale: Looks good., $answered_by: human}
scripts:
  resolve_repo:
    - {exit_code: 0, stdout: '{"full_name": "guplem/pskill"}'}
  search_duplicates:
    - {exit_code: 0, stdout: "[]"}
  create:
    - {exit_code: 0, stdout: "https://github.com/guplem/pskill/issues/31\n"}
expect:
  path: [resolve_repo, assess_clarity, ask_clarify, assess_clarity, ask_clarify, assess_clarity, search_duplicates, judge_duplicates, draft_issue, confirm_draft, create, created]
  status: succeeded
  outputs: {issue_number: 31}
  pending: ""
