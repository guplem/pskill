name: a new commit that is not significant goes on without a question
inputs: {pr: 700, reviewed_sha: a1}
scripts:
  read_head:
    - {exit_code: 0, stdout: '{"head_sha": "b2", "commits": ["b2"]}'}
answers:
  judge:
    - {significant: false, summary: A typo in a comment.}
expect:
  path: [read_head, judge, go_on]
  status: succeeded
  outputs: {action: continue, head_sha: b2}
