name: a significant new commit asks the user, and the answer stop ends the review
inputs: {pr: 700, reviewed_sha: a1}
scripts:
  read_head:
    - {exit_code: 0, stdout: '{"head_sha": "b2", "commits": ["b2"]}'}
answers:
  judge:
    - {significant: true, summary: The retry loop is rewritten.}
  ask:
    - {choice: stop, rationale: The user picked it., $answered_by: human}
expect:
  path: [read_head, judge, ask, stop]
  status: succeeded
  outputs: {action: stop, head_sha: b2}
