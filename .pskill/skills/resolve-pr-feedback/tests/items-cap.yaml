name: a task that stops before the end of the list ends the run capped, with the items that are left
inputs: {pr: 9}
calls:
  checkout:
    - {status: succeeded, outputs: {branch: 42-fix-save, base: main, head_sha: aaa, plan_file: ""}}
scripts:
  collect_items:
    - {exit_code: 0, stdout: '{"queue": [{"kind": "finding", "reviewer": "tests", "file": "src/app.py", "line": 1, "severity": "required", "title": "Gap 1", "summary": "S", "quote": "q"}, {"kind": "finding", "reviewer": "tests", "file": "src/app.py", "line": 2, "severity": "required", "title": "Gap 2", "summary": "S", "quote": "q"}, {"kind": "finding", "reviewer": "tests", "file": "src/app.py", "line": 3, "severity": "required", "title": "Gap 3", "summary": "S", "quote": "q"}], "count": 3, "suggestions": []}'}
  claim_items:
    - {exit_code: 0, stdout: '{"claimed": 0}'}
  finish_items:
    - exit_code: 0
      stdout: >-
        {"decisions": [{"kind": "finding", "reviewer": "tests", "title": "Gap 1", "verdict": "fixed", "reason": "Fixed."},
        {"kind": "finding", "reviewer": "tests", "title": "Gap 2", "verdict": "dismissed", "reason": "No gap."}], "left": 1, "head_sha": "bbb"}
answers:
  resolve_items:
    - decisions:
        - {verdict: fixed, reason: Fixed., commit: abc1234}
        - {verdict: dismissed, reason: No gap.}
expect:
  path: [checkout, collect_items, claim_items, resolve_items, finish_items, capped]
  status: succeeded
  outputs:
    fixed: 1
    left: 1
    head_sha: bbb
    decisions:
      - {kind: finding, reviewer: tests, title: Gap 1, verdict: fixed, reason: Fixed.}
      - {kind: finding, reviewer: tests, title: Gap 2, verdict: dismissed, reason: No gap.}
  pending: >-
    Run the skill again on pull request #9 for the items with no verdict (1 of 3), with the findings that are left as
    its findings input.
