schema: pskill/v1
id: resolve-pr-feedback
description: >-
  Resolve the feedback on a GitHub pull request: the required review findings given to it, and every pull request
  comment that nobody addressed yet, in one task. The suggestion findings are never fixed: one comment lists them. It marks a comment with the eyes reaction when the work on it starts,
  fixes the item or dismisses it with a reason, and replies to the comment. Use when the user asks to address, answer, or
  resolve the comments or the review of a pull request. Starting it authorizes the commits and pushes on the branch
  of the pull request, the reactions, and the replies.
goal: >-
  Every given finding and every unaddressed comment has a verdict (fixed or dismissed) with its reason, and every
  comment has a reply.
x-finding: &finding
  type: object
  properties:
    reviewer: {type: string, optional: true, description: "The reviewer that reported it."}
    file: {type: string}
    line: {type: integer}
    severity: {type: string, enum: [required, suggestion]}
    title: {type: string}
    summary: {type: string}
    quote: {type: string}
inputs:
  pr: {type: integer, description: "Number of the pull request."}
  findings: {type: array, items: *finding, optional: true, description: "Findings to resolve, for example from review-round."}
  scope_sha:
    type: string
    optional: true
    default: ""
    description: "The commit that ends the acceptance scope (the head of the first review round); empty means the head."
outputs:
  decisions:
    type: array
    description: "One decision per resolved item, in order (the capped end leaves out the items past the cap): its kind, its reviewer (empty for a comment), title, verdict, and reason."
    items:
      type: object
      properties:
        kind: {type: string, enum: [finding, comment]}
        reviewer: {type: string, optional: true}
        title: {type: string}
        verdict: {type: string, enum: [fixed, dismissed]}
        reason: {type: string}
  fixed: {type: integer, description: "How many items were fixed."}
  left: {type: integer, description: "How many items have no verdict, because the skill stopped at its cap. 0 when every item has one."}
  head_sha: {type: string, description: "The head commit of the branch at the end, after every push of the skill. A caller compares it with an earlier head to know whether the skill pushed."}
entry: checkout

blocks:
  checkout:
    type: call
    description: Check out the head commit of the pull request
    skill: checkout-pr
    inputs: {pr: "{{ inputs.pr }}"}
    next: collect_items

  collect_items:
    type: script
    description: List the given required findings and the unaddressed comments, and set the suggestions apart
    run: [uv, run, "{{ skill.dir }}/scripts/collect_items.py"]
    input: {pr: "{{ inputs.pr }}", findings: "{{ inputs.findings | default([]) }}"}
    parse: json
    next:
      - when: "{{ steps.collect_items.json.suggestions }}"
        to: post_suggestions
      - when: "{{ steps.collect_items.json.count == 0 }}"
        to: resolved
      - to: claim_items

  post_suggestions:
    type: script
    description: List the suggestion findings in one comment, for a person to take or leave
    run: [uv, run, "{{ skill.dir }}/scripts/post_suggestions.py"]
    input: {pr: "{{ inputs.pr }}", suggestions: "{{ steps.collect_items.json.suggestions }}"}
    parse: json
    retries: 0
    next:
      - when: "{{ steps.collect_items.json.count == 0 }}"
        to: resolved
      - to: claim_items

  claim_items:
    type: script
    description: Mark each comment with the eyes reaction as the work starts
    run: [uv, run, "{{ skill.dir }}/scripts/claim_items.py"]
    input: {items: "{{ steps.collect_items.json.queue }}"}
    parse: json
    next: resolve_items

  resolve_items:
    type: task
    description: Fix or dismiss each item
    context: fresh  # the instruction holds every item: a clean context on a cheaper model
    tier: standard
    instruction: instructions/resolve_items.md
    output:
      decisions:
        type: array
        description: "One decision per item, in the order of the list. Leave out only the items at the end that you did not reach."
        items:
          type: object
          properties:
            verdict: {type: string, enum: [fixed, dismissed], description: "fixed only when you pushed the whole fix or edited the pull request description. A partial fix is dismissed."}
            reason: {type: string, description: "What you changed, or why you dismissed it."}
            commit: {type: string, optional: true, description: "The short hash of the commit of a fix."}
    next: finish_items

  finish_items:
    type: script
    description: Reply to each comment, and record each decision
    run: [uv, run, "{{ skill.dir }}/scripts/finish_items.py"]
    input:
      pr: "{{ inputs.pr }}"
      branch: "{{ steps.checkout.outputs.branch }}"
      items: "{{ steps.collect_items.json.queue }}"
      decisions: "{{ steps.resolve_items.decisions }}"
    parse: json
    # No retries: a second try would post the replies twice.
    retries: 0
    next:
      - when: "{{ steps.finish_items.json.left }}"
        to: capped
      - to: resolved

  resolved:
    type: end
    description: Every item has a verdict
    status: succeeded
    pending: ""
    outputs:
      decisions: &decisions "{{ steps.finish_items.json.decisions | default([]) }}"
      fixed: &fixed "{{ steps.finish_items.json.decisions | default([]) | selectattr('verdict', 'equalto', 'fixed') | list | length }}"
      left: 0
      # With nothing resolved, nothing was pushed: the head is the one that checkout found.
      head_sha: &head_sha "{{ steps.finish_items.json.head_sha | default(steps.checkout.outputs.head_sha) }}"
    report: >-
      Tell the user how each item of pull request #{{ inputs.pr }} was resolved, one line per item:
      {% for decision in steps.finish_items.json.decisions | default([]) %}{{ decision.verdict }}
      "{{ decision.title }}" ({{ decision.reason }}){% if not loop.last %}; {% endif %}{% else %}there was nothing to resolve{% endfor %}.

  capped:
    type: end
    description: The task stopped before every item had a verdict
    status: succeeded
    pending: >-
      Run the skill again on pull request #{{ inputs.pr }} for the items with no verdict
      ({{ steps.finish_items.json.left }} of {{ steps.collect_items.json.count }}), with the findings that are left as
      its findings input.
    outputs:
      decisions: *decisions
      fixed: *fixed
      left: "{{ steps.finish_items.json.left }}"
      head_sha: *head_sha
    report: >-
      Tell the user that the task stopped before the end of the list: {{ steps.finish_items.json.left }} of the
      {{ steps.collect_items.json.count }} items of pull request #{{ inputs.pr }} have no verdict and no reply yet. The
      {{ steps.finish_items.json.decisions | length }} resolved items:
      {{ steps.finish_items.json.decisions | selectattr('verdict', 'equalto', 'fixed') | list | length }} fixed, the
      rest dismissed.
