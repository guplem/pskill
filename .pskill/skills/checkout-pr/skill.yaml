schema: pskill/v1
id: checkout-pr
description: >-
  Check out the branch of a pull request at its head commit, for each skill that works on a pull request. It
  changes nothing when the checkout is already there, and it never discards a change: it pauses the run with the
  reason when the checkout has uncommitted changes or unpushed commits, or when the pull request is not open.
goal: The checkout is on the branch of the pull request, at the commit that GitHub has, with no local change.
invocation: internal
inputs:
  pr: {type: integer, description: "Number of the pull request."}
outputs:
  branch: {type: string, description: "The branch of the pull request."}
  base: {type: string, description: "The branch that the pull request targets."}
  head_sha: {type: string, description: "The full sha of the head commit."}
  plan_file: {type: string, description: "The implementation plan file that the branch added, or an empty text."}
entry: checkout_pr

blocks:
  checkout_pr:
    type: script
    description: Switch to the branch of the pull request, and update it
    run: [uv, run, "{{ skill.dir }}/scripts/checkout_pr.py"]
    input: {pr: "{{ inputs.pr }}"}
    parse: json
    retries: 0
    next: checked_out

  checked_out:
    type: end
    description: The checkout is on the head commit of the pull request
    status: succeeded
    outputs:
      branch: "{{ steps.checkout_pr.json.branch }}"
      base: "{{ steps.checkout_pr.json.base }}"
      head_sha: "{{ steps.checkout_pr.json.head_sha }}"
      plan_file: "{{ steps.checkout_pr.json.plan_file }}"
