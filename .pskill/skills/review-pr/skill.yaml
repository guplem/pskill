schema: pskill/v1
id: review-pr
description: >-
  Review a pull request in depth, and post one GitHub review on it after the user confirms it. Fresh review subagents
  review the whole pull request in rounds that skip what earlier rounds and earlier runs of this skill found: up to 4
  review rounds, each with fewer reviewers and a stricter bar, while a round finds a new required finding, then
  critical rounds on what the new code breaks, until one finds nothing new (at most 6). A round of repeats counts as
  clean. Then check and merge the findings, and ask the user about each finding in real doubt. The review requests
  changes when a new or an earlier required finding is still open, and approves otherwise; on the user's own pull
  request it only comments. A finding goes inline when the diff shows its line, and into the review body otherwise.
  When the head moves in a significant way, ask the user to restart, continue, or stop. It changes no file. An
  autonomous run posts nothing: it ends with the draft. Starting it authorizes the review that the user confirms.
goal: >-
  One review on the pull request that the user confirmed: it holds every new real problem once, with the right
  severity, and its verdict follows from the findings.
invocation: manual
x-finding: &finding
  type: object
  properties:
    reviewer: {type: string}
    file: {type: string}
    line: {type: integer}
    severity: {type: string, enum: [required, suggestion]}
    title: {type: string}
    summary: {type: string}
    quote: {type: string}
# The head commit that the last round reviewed: the head checks compare with it, and the post goes on it.
x-reviewed-sha: &reviewed_sha "{{ (steps.critical if steps.critical is defined else steps.review).outputs.reviewed_sha }}"
inputs:
  pr: {type: integer, description: "Number of the pull request."}
  max_rounds:
    type: integer
    optional: true
    default: 10
    description: >-
      The most rounds to run, review rounds and critical rounds together: up to 4 review rounds, then up to 6 critical
      rounds, so a value above 10 changes nothing. A small value cuts the review short: the critical rounds get only
      the rounds that the review rounds leave, and with 4 or less, the review rounds can use them all, so no critical
      round runs.
outputs:
  result:
    type: string
    enum: [changes_requested, approved, commented, not_posted, restarted]
    description: >-
      The event of the posted review: commented on the user's own pull request, which GitHub does not let the user
      approve or block. not_posted when the user did not confirm the review or stopped it, or in an autonomous run.
      restarted when the user restarted the review after the head moved: a new run does the review.
  review_url: {type: string, optional: true, description: "URL of the posted review, when one was posted."}
entry: read_earlier

blocks:
  read_earlier:
    type: script
    description: List the findings that earlier reviews already posted on the pull request
    run: [uv, run, "{{ skill.dir }}/scripts/read_earlier_reviews.py"]
    input: {pr: "{{ inputs.pr }}"}
    parse: json
    next: review

  # Review rounds: each round has a stricter bar and fewer reviewers (review-round holds both).
  review:
    type: call
    description: Run one review round, with the findings of the earlier rounds and reviews to skip
    skill: review-round
    inputs:
      pr: "{{ inputs.pr }}"
      round: "{{ (history.review | length) + 1 }}"
      reported: "{{ history.review | map(attribute='outputs') | map(attribute='findings') | sum(start=[]) }}"
      # A follow-up review reviews the whole pull request too: the findings of earlier reviews are only skipped.
      dismissed: "{{ steps.read_earlier.json.dismissed }}"
    # The arrows below already stop at round 4. This cap is only a safety net, so it never asks.
    max_visits: 10
    on_max_visits: triage
    ask_on_max_visits: false
    next:
      - when: "{{ (history.review | length) >= inputs.max_rounds }}"
        to: triage
      - when: "{{ (history.review | length) >= 4 }}"
        to: check_head_before_critical
      - to: new_in_review

  # A round counts only its new findings: one at the file and line of an earlier finding of the run, with its title
  # or its reviewer, repeats it. So a round whose findings all repeat earlier ones is clean.
  new_in_review:
    type: script
    description: Keep the findings of the review round that repeat no earlier finding of the run
    run: [uv, run, "{{ skill.dir }}/scripts/new_findings.py"]
    input:
      findings: "{{ steps.review.outputs.findings }}"
      reported: "{{ history.review[:-1] | map(attribute='outputs') | map(attribute='findings') | sum(start=[]) }}"
    parse: json
    # The same safety net as on review.
    max_visits: 10
    on_max_visits: triage
    ask_on_max_visits: false
    next:
      # Another review round, while this one found a new required finding.
      - when: "{{ steps.new_in_review.json.required }}"
        to: check_head_before_round
      - to: check_head_before_critical

  check_head_before_round:
    type: call
    description: Check if the head moved before the next review round
    skill: review-head-check
    inputs: {pr: "{{ inputs.pr }}", reviewed_sha: *reviewed_sha}
    # The same safety net as on review.
    max_visits: 10
    on_max_visits: triage
    ask_on_max_visits: false
    next:
      - when: "{{ steps.check_head_before_round.outputs.action == 'restart' }}"
        to: restarted
      - when: "{{ steps.check_head_before_round.outputs.action == 'stop' }}"
        to: stopped
      - to: review

  check_head_before_critical:
    type: call
    description: Check if the head moved before the next critical round
    skill: review-head-check
    inputs: {pr: "{{ inputs.pr }}", reviewed_sha: *reviewed_sha}
    # The same safety net as on critical.
    max_visits: 10
    on_max_visits: triage
    ask_on_max_visits: false
    next:
      - when: "{{ steps.check_head_before_critical.outputs.action == 'restart' }}"
        to: restarted
      - when: "{{ steps.check_head_before_critical.outputs.action == 'stop' }}"
        to: stopped
      - to: critical

  # Critical rounds: only critical-bugs runs, and it reports only what the new code breaks, each finding required.
  critical:
    type: call
    description: Run one critical round, with every finding of the run so far to skip
    skill: review-round
    inputs:
      pr: "{{ inputs.pr }}"
      critical: true
      reported: "{{ (history.review + history.critical) | map(attribute='outputs') | map(attribute='findings') | sum(start=[]) }}"
      dismissed: "{{ steps.read_earlier.json.dismissed }}"
    # The arrow below already stops at 6 critical rounds. This cap is only a safety net, so it never asks.
    max_visits: 10
    on_max_visits: triage
    ask_on_max_visits: false
    next:
      - when: >-
          {{ (history.critical | length) >= 6
          or ((history.review | length) + (history.critical | length)) >= inputs.max_rounds }}
        to: triage
      - to: new_in_critical

  new_in_critical:
    type: script
    description: Keep the findings of the critical round that repeat no earlier finding of the run
    run: [uv, run, "{{ skill.dir }}/scripts/new_findings.py"]
    input:
      findings: "{{ steps.critical.outputs.findings }}"
      reported: "{{ (history.review + history.critical[:-1]) | map(attribute='outputs') | map(attribute='findings') | sum(start=[]) }}"
    parse: json
    # The same safety net as on critical.
    max_visits: 10
    on_max_visits: triage
    ask_on_max_visits: false
    next:
      # Another critical round, while this one found a new problem.
      - when: "{{ steps.new_in_critical.json.new }}"
        to: check_head_before_critical
      - to: triage

  triage:
    type: task
    description: Check and merge the findings of every review and critical round, and mark the ones in real doubt
    context: fresh  # the instruction holds every finding: a clean context on a cheaper model, reading code only
    tier: standard
    tools: read
    instruction: instructions/triage.md
    output:
      findings: {type: array, items: *finding, description: "The findings to post, each with its final severity."}
      dropped:
        type: array
        description: "The findings that are not real, that repeat another one, or that an earlier review already posted."
        items:
          type: object
          properties:
            title: {type: string}
            reason: {type: string}
      still_open:
        type: array
        description: "The findings of earlier reviews that the head does not fix. The review does not post them again."
        items:
          type: object
          properties:
            title: {type: string}
            severity: {type: string, enum: [required, suggestion]}
            location: {type: string}
      doubts:
        type: array
        description: "The findings in real doubt, for the user to settle. Empty when nothing is in real doubt."
        items:
          type: object
          properties:
            finding: *finding
            doubt: {type: string, description: "The test of the decision gate that failed, and why the answer is not clear."}
            recommendation: {type: string, enum: [required, suggestion, drop]}
    next:
      # An autonomous run asks no human: the recommendation of the triage settles each doubt.
      - when: "{{ steps.triage.doubts and run.mode != 'autonomous' }}"
        to: settle_doubt
      - to: final

  settle_doubt:
    type: call
    description: Ask the user about the next finding in doubt
    skill: review-doubt
    inputs:
      pr: "{{ inputs.pr }}"
      finding: "{{ steps.triage.doubts[history.settle_doubt | length].finding }}"
      doubt: "{{ steps.triage.doubts[history.settle_doubt | length].doubt }}"
      recommendation: "{{ steps.triage.doubts[history.settle_doubt | length].recommendation }}"
    max_visits: 50
    on_max_visits: final
    next:
      - when: "{{ (history.settle_doubt | length) < (steps.triage.doubts | length) }}"
        to: settle_doubt
      - to: final

  final:
    type: script
    description: Build the final list of findings from the triage and the settled doubts
    run: [uv, run, "{{ skill.dir }}/scripts/final_findings.py"]
    input:
      findings: "{{ steps.triage.findings }}"
      still_open: "{{ steps.triage.still_open }}"
      doubts: "{{ steps.triage.doubts }}"
      verdicts: "{{ history.settle_doubt | map(attribute='outputs') | list }}"
    parse: json
    next: draft

  draft:
    type: task
    description: Write the body of the review
    instruction: instructions/draft.md
    output:
      body: {type: string, description: "The body of the review, as Markdown."}
    next:
      # Posting is never automatic: an autonomous run has no human to confirm the review.
      - when: "{{ run.mode == 'autonomous' }}"
        to: not_posted
      - to: confirm

  confirm:
    type: decision
    description: Show the review and ask the user to confirm it
    decider: human
    instruction: instructions/confirm.md
    max_visits: 5
    on_max_visits: not_posted
    choices:
      post: Post the review as it is.
      revise: Change the review first.
      cancel: Do not post the review.
    next: {post: check_head_before_post, revise: ask_revision, cancel: not_posted}

  ask_revision:
    type: decision
    description: Ask what to change in the review
    decider: human
    instruction: Ask the user what to change in the review.
    next: draft

  check_head_before_post:
    type: call
    description: Check if the head moved before the post
    skill: review-head-check
    inputs: {pr: "{{ inputs.pr }}", reviewed_sha: *reviewed_sha}
    next:
      - when: "{{ steps.check_head_before_post.outputs.action == 'restart' }}"
        to: restarted
      - when: "{{ steps.check_head_before_post.outputs.action == 'stop' }}"
        to: stopped
      - to: post

  post:
    type: script
    description: Post the review, inline where the diff shows the line of a finding
    run: [uv, run, "{{ skill.dir }}/scripts/post_review.py"]
    input:
      pr: "{{ inputs.pr }}"
      commit: *reviewed_sha
      body: "{{ steps.draft.body }}"
      findings: "{{ steps.final.json.findings }}"
      has_required: "{{ steps.final.json.has_required }}"
    parse: json
    retries: 0
    next: reviewed

  reviewed:
    type: end
    description: The review is on the pull request
    status: succeeded
    pending: >-
      {% if steps.final.json.findings or steps.triage.still_open %}The author of pull request #{{ inputs.pr }} answers the
      open findings of the review{% if steps.triage.still_open %} and of earlier reviews{% endif %}.{% endif %}
    outputs: {result: "{{ steps.post.json.result }}", review_url: "{{ steps.post.json.review_url }}"}
    report: instructions/report_reviewed.md

  not_posted:
    type: end
    description: The review is drafted, but not posted
    status: succeeded
    pending: >-
      {% if run.mode == 'autonomous' %}Run review-pr again on pull request #{{ inputs.pr }} in an interactive run, to post a
      review.{% endif %}
    outputs: {result: not_posted}
    report: instructions/report_not_posted.md

  stopped:
    type: end
    description: The user stopped the review after the head moved
    status: succeeded
    pending: ""
    outputs: {result: not_posted}
    report: instructions/report_stopped.md

  restarted:
    type: end
    description: The user restarted the review after the head moved
    status: succeeded
    pending: "The agent starts review-pr again on pull request #{{ inputs.pr }} right away, on its new head."
    outputs: {result: restarted}
    report: instructions/report_restarted.md
