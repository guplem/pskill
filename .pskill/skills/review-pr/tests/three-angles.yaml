name: the main agent picks three angles and analyze waits for three answers
inputs: {pr: 5, post_verdict: false}
scripts:
  read_pr:
    - {exit_code: 0, stdout: '{"headRefOid": "abc", "baseRefName": "main", "files": [], "additions": 300, "deletions": 20}'}
  verify_quotes:
    - {exit_code: 0, stdout: '{"findings": []}'}
answers:
  plan_review:
    - angles:
        - {focus: correctness, brief: Check the parser.}
        - {focus: security, brief: Check the file paths.}
        - {focus: tests, brief: Check the new cases.}
  analyze:
    - {findings: []}
    - {findings: []}
    - {findings: []}
  triage:
    - {findings: []}
expect:
  path: [read_pr, plan_review, analyze, triage, verify_quotes, report]
  outputs: {findings: []}
