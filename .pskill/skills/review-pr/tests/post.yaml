name: the user chooses to post the review
inputs: {pr: 5}
scripts:
  read_pr:
    - {exit_code: 0, stdout: '{"headRefOid": "abc", "baseRefName": "main", "files": [], "additions": 3, "deletions": 1}'}
  verify_quotes:
    - {exit_code: 0, stdout: '{"findings": []}'}
answers:
  plan_review:
    - {angles: [{focus: tests, brief: Check the new test.}]}
  analyze:
    - {findings: []}
  triage:
    - {findings: []}
  confirm_post:
    - {choice: post, rationale: Post it., $answered_by: human}
