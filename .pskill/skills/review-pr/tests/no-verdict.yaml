name: post_verdict false returns the findings and never asks to post
inputs: {pr: 5, post_verdict: false}
scripts:
  read_pr:
    - {exit_code: 0, stdout: '{"headRefOid": "abc", "baseRefName": "main", "files": [], "additions": 3, "deletions": 1}'}
  verify_quotes:
    - {exit_code: 0, stdout: '{"findings": [{"file": "a.py", "line": 3, "severity": "major", "summary": "Wrong sum.", "quote": "return a - b"}]}'}
answers:
  plan_review:
    - {angles: [{focus: correctness, brief: Check the sum.}]}
  analyze:
    - {findings: [{file: a.py, line: 3, severity: major, summary: Wrong sum., quote: return a - b}]}
  triage:
    - {findings: [{file: a.py, line: 3, severity: major, summary: Wrong sum., quote: return a - b}]}
expect:
  path: [read_pr, plan_review, analyze, triage, verify_quotes, report]
  status: succeeded
  outputs:
    findings: [{file: a.py, line: 3, severity: major, summary: Wrong sum., quote: return a - b}]
