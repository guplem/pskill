name: a significant push between review rounds lets the user restart, and the run ends without a post
inputs: {pr: 700}
calls:
  review:
    - {status: succeeded, outputs: {reviewed_sha: h1, findings: [{reviewer: completeness, file: sdk/a.py, line: 1, severity: required, title: A, summary: S, quote: q}]}}
  check_head_before_round:
    - {status: succeeded, inputs: {reviewed_sha: h1}, outputs: {action: restart, head_sha: h2}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  new_in_review:
    - {exit_code: 0, stdout: '{"new": [{"reviewer": "completeness", "file": "sdk/a.py", "line": 1, "severity": "required", "title": "A", "summary": "S", "quote": "q"}], "required": 1}'}
expect:
  path: [read_earlier, review, new_in_review, check_head_before_round, restarted]
  status: succeeded
  outputs: {result: restarted}
  pending: "The agent starts review-pr again on pull request #700 right away, on its new head."
