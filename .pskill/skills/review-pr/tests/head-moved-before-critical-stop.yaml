name: a significant push between critical rounds lets the user stop, and nothing is posted
inputs: {pr: 700}
calls:
  review:
    - {status: succeeded, outputs: {reviewed_sha: h1, findings: []}}
  check_head_before_critical:
    - {status: succeeded, inputs: {reviewed_sha: h1}, outputs: {action: continue, head_sha: h1}}
    - {status: succeeded, inputs: {reviewed_sha: h1}, outputs: {action: stop, head_sha: h2}}
  critical:
    - {status: succeeded, outputs: {reviewed_sha: h1, findings: [{reviewer: critical-bugs, file: sdk/a.py, line: 4, severity: required, title: C1, summary: S, quote: q}]}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  new_in_review:
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  new_in_critical:
    - {exit_code: 0, stdout: '{"new": [{"reviewer": "critical-bugs", "file": "sdk/a.py", "line": 4, "severity": "required", "title": "C1", "summary": "S", "quote": "q"}], "required": 1}'}
expect:
  path: [read_earlier, review, new_in_review, check_head_before_critical, critical, new_in_critical, check_head_before_critical, stopped]
  status: succeeded
  outputs: {result: not_posted}
  pending: ""
