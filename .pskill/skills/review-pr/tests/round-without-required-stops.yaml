name: a review round with no new required finding ends the review rounds, also when it found suggestions
inputs: {pr: 700}
calls:
  check_head_before_round:
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
  check_head_before_critical:
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
  check_head_before_post:
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
  review:
    - {status: succeeded, outputs: {reviewed_sha: d4, findings: [{reviewer: completeness, file: sdk/a.py, line: 1, severity: required, title: A, summary: S, quote: q}]}}
    - {status: succeeded, outputs: {reviewed_sha: d4, findings: [{reviewer: completeness, file: sdk/a.py, line: 2, severity: suggestion, title: B, summary: S, quote: q}]}}
  critical:
    - {status: succeeded, outputs: {reviewed_sha: d4, findings: []}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  new_in_review:
    - {exit_code: 0, stdout: '{"new": [{"reviewer": "completeness", "file": "sdk/a.py", "line": 1, "severity": "required", "title": "A", "summary": "S", "quote": "q"}], "required": 1}'}
    - {exit_code: 0, stdout: '{"new": [{"reviewer": "completeness", "file": "sdk/a.py", "line": 2, "severity": "suggestion", "title": "B", "summary": "S", "quote": "q"}], "required": 0}'}
  new_in_critical:
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  final:
    - {exit_code: 0, stdout: '{"findings": [], "has_required": true, "cut_short": false}'}
  post:
    - {exit_code: 0, stdout: '{"result": "changes_requested", "review_url": "u", "inline": 3, "in_body": 0, "fallback": false}'}
answers:
  triage:
    - {findings: [], dropped: [], still_open: [], doubts: []}
  draft:
    - {body: "Changes requested."}
  confirm:
    - {choice: post, rationale: The user picked it., $answered_by: human}
expect:
  path: [read_earlier, review, new_in_review, check_head_before_round, review, new_in_review, check_head_before_critical, critical, new_in_critical, triage, final, draft, confirm, check_head_before_post, post, reviewed]
  status: succeeded
