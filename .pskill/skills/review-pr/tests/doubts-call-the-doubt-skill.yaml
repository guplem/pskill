name: two findings in doubt make two calls of the doubt skill, before the final list is built
inputs: {pr: 700}
calls:
  check_head_before_round:
    - {status: succeeded, outputs: {action: continue, head_sha: h1}}
  check_head_before_post:
    - {status: succeeded, outputs: {action: continue, head_sha: h1}}
  review:
    - {status: succeeded, outputs: {reviewed_sha: b2, scope_sha: b2, findings: [{reviewer: conventions, file: src/app.py, line: 5, severity: required, title: Breaks recorded decision 4, summary: S, quote: q}]}}
    - {status: succeeded, outputs: {reviewed_sha: b2, scope_sha: b2, findings: []}}
  settle_doubt:
    - {status: succeeded, outputs: {verdict: drop, reason: The caller caps it.}}
    - {status: succeeded, outputs: {verdict: suggestion, reason: The recorded decision allows it for scripts.}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  final:
    - {exit_code: 0, stdout: '{"findings": [{"reviewer": "conventions", "file": "src/app.py", "line": 5, "severity": "suggestion", "title": "Breaks recorded decision 4", "summary": "S", "quote": "q"}], "has_required": false}'}
  post:
    - {exit_code: 0, stdout: '{"result": "approved", "review_url": "u2", "inline": 1, "in_body": 0, "fallback": false}'}
answers:
  triage:
    - findings: []
      dropped: []
      still_open: []
      doubts:
        - {finding: {reviewer: correctness, file: src/app.py, line: 3, severity: required, title: Retry has no cap, summary: S, quote: q}, doubt: Test 1 fails, recommendation: suggestion}
        - {finding: {reviewer: conventions, file: src/app.py, line: 5, severity: required, title: Breaks recorded decision 4, summary: S, quote: q}, doubt: Test 3 fails, recommendation: required}
  draft:
    - {body: "Approved, with one suggestion."}
  confirm:
    - {choice: post, rationale: The user picked it., $answered_by: human}
expect:
  path: [read_earlier, review, check_head_before_round, review, triage, settle_doubt, settle_doubt, final, draft, confirm, check_head_before_post, post, reviewed]
  status: succeeded
  outputs: {result: approved, review_url: u2}
