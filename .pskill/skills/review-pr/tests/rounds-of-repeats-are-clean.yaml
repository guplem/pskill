name: a review round whose findings all repeat earlier ones ends the review rounds, and so does a critical round for the critical rounds
inputs: {pr: 700}
calls:
  check_head_before_round:
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
  check_head_before_critical:
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
  check_head_before_post:
    - {status: succeeded, outputs: {action: continue, head_sha: d4}}
  review:
    - {status: succeeded, inputs: {round: 1}, outputs: {reviewed_sha: d4, findings: [{reviewer: docs, file: a.md, line: 1, severity: required, title: A, summary: S, quote: q}]}}
    # The place and the reviewer of A, under another title: a repeat. (A correctness finding at that line would be new.)
    - {status: succeeded, inputs: {round: 2}, outputs: {reviewed_sha: d4, findings: [{reviewer: docs, file: a.md, line: 1, severity: required, title: A again, summary: S, quote: q}]}}
  critical:
    - {status: succeeded, outputs: {reviewed_sha: d4, findings: [{reviewer: critical-bugs, file: a.py, line: 7, severity: required, title: C1, summary: S, quote: q}]}}
    # The place and the title of C1: a repeat. (The title of C1 at another line would be new.)
    - {status: succeeded, outputs: {reviewed_sha: d4, findings: [{reviewer: critical-bugs, file: a.py, line: 7, severity: required, title: C1, summary: S, quote: q}]}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  new_in_review:
    - {exit_code: 0, stdout: '{"new": [{"reviewer": "docs", "file": "a.md", "line": 1, "severity": "required", "title": "A", "summary": "S", "quote": "q"}], "required": 1}'}
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  new_in_critical:
    - {exit_code: 0, stdout: '{"new": [{"reviewer": "critical-bugs", "file": "a.py", "line": 7, "severity": "required", "title": "C1", "summary": "S", "quote": "q"}], "required": 1}'}
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  final:
    - {exit_code: 0, stdout: '{"findings": [], "has_required": true, "cut_short": false}'}
  post:
    - {exit_code: 0, stdout: '{"result": "changes_requested", "review_url": "u", "inline": 2, "in_body": 0, "fallback": false}'}
answers:
  triage:
    - {findings: [], dropped: [], still_open: [], doubts: []}
  draft:
    - {body: "Changes requested."}
  confirm:
    - {choice: post, rationale: The user picked it., $answered_by: human}
expect:
  path: [read_earlier, review, new_in_review, check_head_before_round, review, new_in_review, check_head_before_critical, critical, new_in_critical, check_head_before_critical, critical, new_in_critical, triage, final, draft, confirm, check_head_before_post, post, reviewed]
  status: succeeded
