name: a significant push after the confirm lets the user stop, and nothing is posted
inputs: {pr: 700}
calls:
  review:
    - {status: succeeded, outputs: {reviewed_sha: h1, findings: []}}
  check_head_before_post:
    - {status: succeeded, outputs: {action: stop, head_sha: h2}}
  critical:
    - {status: succeeded, outputs: {reviewed_sha: h1, findings: []}}
  check_head_before_critical:
    - {status: succeeded, outputs: {action: continue, head_sha: h1}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  new_in_review:
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  new_in_critical:
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  final:
    - {exit_code: 0, stdout: '{"findings": [], "has_required": false, "cut_short": false}'}
answers:
  triage:
    - {findings: [], dropped: [], still_open: [], doubts: []}
  draft:
    - {body: "OK to merge."}
  confirm:
    - {choice: post, rationale: The user picked it., $answered_by: human}
expect:
  path: [read_earlier, review, new_in_review, check_head_before_critical, critical, new_in_critical, triage, final, draft, confirm, check_head_before_post, stopped]
  status: succeeded
  outputs: {result: not_posted}
