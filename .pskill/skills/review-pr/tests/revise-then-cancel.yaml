name: the user can revise the draft, and cancel the review so that nothing is posted
inputs: {pr: 700}
calls:
  review:
    - {status: succeeded, outputs: {reviewed_sha: h8, findings: []}}
  critical:
    - {status: succeeded, outputs: {reviewed_sha: h8, findings: []}}
  check_head_before_critical:
    - {status: succeeded, outputs: {action: continue, head_sha: h1}}
scripts:
  read_earlier:
    - {exit_code: 0, stdout: '{"dismissed": [], "count": 0}'}
  new_in_review:
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  new_in_critical:
    - {exit_code: 0, stdout: '{"new": [], "required": 0}'}
  final:
    - {exit_code: 0, stdout: '{"findings": [], "has_required": false, "cut_short": false}'}
answers:
  triage:
    - {findings: [], dropped: [], still_open: [], doubts: []}
  draft:
    - {body: "OK to merge."}
    - {body: "OK to merge, nice work."}
  confirm:
    - {choice: revise, rationale: The user picked it., $answered_by: human}
    - {choice: cancel, rationale: The user picked it., $answered_by: human}
  ask_revision:
    - {answer: Thank the author., $answered_by: human}
expect:
  path: [read_earlier, review, new_in_review, check_head_before_critical, critical, new_in_critical, triage, final, draft, confirm, ask_revision, draft, confirm, not_posted]
  status: succeeded
  outputs: {result: not_posted}
