name: an obsolete issue closes after the user confirms
inputs: {issue: "42"}
scripts:
  read_issue:
    - {exit_code: 0, stdout: '{"number": 42, "title": "Crash on save", "body": "Saving crashes.", "labels": [], "comments": []}'}
  close_issue:
    - {exit_code: 0}
answers:
  check_applies:
    - {choice: obsolete, rationale: Fixed in 40., evidence: "pskill_runner/cli.py:12"}
  confirm_close:
    - {choice: close, rationale: The user agreed., comment: "Fixed by #40.", $answered_by: human}
expect:
  path: [read_issue, check_applies, confirm_close, close_issue, closed]
  status: succeeded
  outputs: {result: closed}
