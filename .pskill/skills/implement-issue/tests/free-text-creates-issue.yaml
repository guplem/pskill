name: a free-text request files an issue first, then reads it
inputs: {issue: Add a dark theme to the viewer.}
calls:
  create_new_issue:
    - {status: succeeded, outputs: {issue_number: 77}}
scripts:
  read_issue:
    - {exit_code: 0, stdout: '{"number": 77, "title": "Dark theme", "body": "", "labels": [], "comments": []}'}
answers:
  check_applies:
    - {choice: obsolete, rationale: The viewer does not exist yet., evidence: "none"}
  confirm_close:
    - {choice: keep, rationale: Keep it for later., comment: "-", $answered_by: human}
expect:
  path: [create_new_issue, read_issue, check_applies, confirm_close, stopped]
  status: cancelled
  outputs: {result: stopped}
