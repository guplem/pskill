    - {exit_code: 0, stdout: '{"unreviewed": true, "commits": ["c1"], "head_sha": "h1"}'}
    - {exit_code: 0, stdout: '{"unreviewed": true, "commits": ["c1"], "head_sha": "h1"}'}
calls:
  review:
    - {status: succeeded, outputs: {findings: [], reviewed_sha: r1, scope_sha: r1}}
  resolve:
    - {status: succeeded, outputs: {decisions: [], fixed: 0}}
  final_review:
    - {status: succeeded, outputs: {findings: [{reviewer: tests, file: files.py, line: 3, severity: required, title: No test, summary: S, quote: q}], reviewed_sha: f1, scope_sha: r1}}
    - {status: succeeded, outputs: {findings: [{reviewer: tests, file: files.py, line: 3, severity: required, title: No test, summary: S, quote: q}], reviewed_sha: f2, scope_sha: r1}}
    - {status: succeeded, outputs: {findings: [{reviewer: tests, file: files.py, line: 3, severity: required, title: No test, summary: S, quote: q}], reviewed_sha: f3, scope_sha: r1}}
    - {status: succeeded, outputs: {findings: [{reviewer: tests, file: files.py, line: 3, severity: required, title: No test, summary: S, quote: q}], reviewed_sha: f4, scope_sha: r1}}
    - {status: succeeded, outputs: {findings: [{reviewer: tests, file: files.py, line: 3, severity: required, title: No test, summary: S, quote: q}], reviewed_sha: f5, scope_sha: r1}}
  final_resolve:
    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: No test, verdict: fixed, reason: Added it.}], fixed: 1}}
    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: No test, verdict: fixed, reason: Added it.}], fixed: 1}}
    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: No test, verdict: fixed, reason: Added it.}], fixed: 1}}
    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: No test, verdict: fixed, reason: Added it.}], fixed: 1}}
    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: No test, verdict: fixed, reason: Added it.}], fixed: 1}}
  get_ci_green:
    - {status: succeeded, outputs: {state: passed, failed_checks: [], head_sha: h1, fixes: 0}}
  answer_comments:
    - {status: succeeded, outputs: {decisions: [], fixed: 0}}
answers:
  understand:
    - {title: Fix the crash when a file is saved with no name, slug: fix-save, brief: Guard the save., base: main, gaps: []}
  research_code:
    - {report: The rename guard in files.py is the closest code.}
    - {report: No recorded decision affects this work.}
  write_plan:
    - {summary: "1. Guard the save. 2. Test it."}
  approve_plan:
    - {choice: approve, rationale: The user approved., $answered_by: human}
  implement_step:
    - {behavior: A file with no name is not saved., red: The new test crashed., commit: a1, done: true}
  write_description:
    - {summary: Saving a file with no name shows an error instead of crashing.}
  finish:
    - {labels: [], reasons: "Required findings are still left after 5 extra rounds."}
expect:
