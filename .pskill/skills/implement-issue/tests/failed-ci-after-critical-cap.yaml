    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: Missing guard, verdict: fixed, reason: Added it.}], fixed: 1}}
    - {status: succeeded, outputs: {decisions: [{kind: finding, reviewer: tests, title: Missing guard, verdict: fixed, reason: Added it.}], fixed: 1}}
