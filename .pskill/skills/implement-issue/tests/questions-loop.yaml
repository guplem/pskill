name: two questions one by one, then the plan, the work, and a clean review
inputs: {issue: "42"}
scripts:
  read_issue:
    - {exit_code: 0, stdout: '{"number": 42, "title": "Crash on save", "body": "Saving crashes.", "labels": [], "comments": []}'}
  publish_plan:
    - {exit_code: 0}
calls:
  review:
    - {status: succeeded, outputs: {findings: []}}
answers:
  check_applies:
    - {choice: applies, rationale: The crash still happens., evidence: "pskill_runner/cli.py:40"}
  research:
    - {report: "Similar code: pskill_runner/engine.py."}
    - {report: No recorded decision affects this work.}
  create_plan:
    - {status: question, plan: Draft., question: "Should the fix also cover autosave?"}
    - {status: question, plan: Draft 2., question: "Should it log the error?"}
    - {status: finished, plan: "1. Guard the save. 2. Add a test."}
  ask_user:
    - {answer: "Yes.", question: "Should the fix also cover autosave?", $answered_by: human}
    - {answer: "No.", question: "Should it log the error?", $answered_by: human}
  approve_plan:
    - {choice: approve, rationale: Good plan., $answered_by: human}
  implement:
    - {pr_number: 50, pr_url: "https://github.com/guplem/pskill/pull/50"}
expect:
  path: [read_issue, check_applies, research, create_plan, ask_user, create_plan, ask_user, create_plan,
         approve_plan, publish_plan, implement, review, done]
  status: succeeded
  outputs: {result: implemented, pr_url: "https://github.com/guplem/pskill/pull/50"}
