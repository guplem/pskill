schema: pskill/v1
id: implement-issue
description: >-
  Implement a GitHub issue, or a described change, end to end. Settle its open questions (ask the user only what the
  code cannot answer), agree on a plan, open a draft pull request with it, and build it in red-green commits. Then
  review it with fresh subagents and resolve the findings and comments, round after round. Then mark it ready, get CI
  green, give each later fix a review for required findings only, and label it when a human must look. It never
  merges. Use when the user asks to implement, fix, or work on an issue or a change. Starting it authorizes the issue
  assignment, the branch, the commits and pushes, the pull request, and the replies to its comments.
goal: >-
  A pull request that is ready to merge as it is: every CI check green, every review finding fixed or dismissed, no
  plan file, and the waiting-for-human-review label only when a human must look before the merge.
inputs:
  request: {type: string, description: "The issue number or link ('#123' too), or a description of the change to build."}
outputs:
  result: {type: string, enum: [implemented, capped, held, stopped], description: "How the skill ended."}
  pr_number: {type: integer, optional: true, description: "Number of the pull request, when one exists."}
  pr_url: {type: string, optional: true, description: "URL of the pull request, when one exists."}
  limits: {type: array, items: {type: string}, optional: true, description: "The limits that cut work short, for the capped result."}
entry:
  - when: "{{ inputs.request is matches('^ *#?[0-9]+ *$|^ *https://github[.]com/[^ ]+/issues/[0-9]+ *$') }}"
    to: read_issue
  - to: create_new_issue

blocks:
  create_new_issue:
    type: call
    description: File the described change as an issue
    skill: create-issue
    inputs: {description: "{{ inputs.request }}", mark_unchecked: false}
    next:
      - when: "{{ steps.create_new_issue.status == 'succeeded' }}"
        to: read_issue
      - to: stopped

  read_issue:
    type: script
    description: Read the issue, and check that the work may start
    run: [uv, run, "{{ skill.dir }}/scripts/read_issue.py"]
    input: {request: "{{ steps.create_new_issue.outputs.issue_number | default(inputs.request) }}"}
    parse: json
    next:
      - when: "{{ steps.read_issue.json.hold_reason }}"
        to: held
      - to: checkout_default

  checkout_default:
    type: script
    description: Switch to the latest code of the default branch
    run: [uv, run, "{{ skill.dir }}/scripts/checkout_default_branch.py"]
    parse: json
    next:
      - when: "{{ not steps.checkout_default.json.ok }}"
        to: stopped
      - to: understand

  understand:
    type: task
    description: Understand the work and list its gaps
    instruction: instructions/understand.md
    output:
      title: {type: string, description: "The pull request title, in the style of the repository's recent pull requests."}
      slug: {type: string, description: "2 to 5 kebab-case words, for the branch name."}
      brief: {type: string, description: "Goal, requirements and decisions, constraints, prior work, related context."}
      base: {type: string, description: "The branch to start from and to target: the default branch, or an unmerged branch that the work needs."}
      gaps:
        type: array
        description: "The open questions whose answer changes the plan. One research task each. Often empty."
        items:
          type: object
          properties:
            name: {type: string, description: "2 to 4 words, for the viewer."}
            question: {type: string, description: "The question, with what the request already says."}
      blocker: {type: string, optional: true, description: "Why the work must not start. Leave it out when the work can start."}
    next:
      - when: "{{ (steps.understand.blocker | default('')) != '' }}"
        to: held
      - to: checkout_base

  checkout_base:
    type: script
    description: Switch to the latest base code, name the branch, and claim the issue
    run: [uv, run, "{{ skill.dir }}/scripts/checkout_base.py"]
    input: {base: "{{ steps.understand.base }}", slug: "{{ steps.understand.slug }}", issue: "{{ steps.read_issue.json.number }}"}
    parse: json
    next:
      - when: "{{ not steps.checkout_base.json.ok }}"
        to: stopped
      - to: research_code

  research_code:
    type: parallel
    description: Find the closest code and the recorded decisions, each with a fresh subagent
    for_each:
      - {agent: pattern-scout, question: "Which existing code is closest to this change, and which conventions does it follow?"}
      - {agent: adr-checker, question: "Which recorded decisions (ADRs, AGENTS.md rules, design docs) limit this change?"}
    agent: "{{ item.agent }}"
    task_name: "{{ item.agent }}"
    instruction: >-
      {{ item.question }} The change: "{{ steps.understand.title }}". The brief: {{ steps.understand.brief }}
    output:
      report: {type: string, description: "What you found, with file paths and decision references."}
    next: research_gaps

  research_gaps:
    type: parallel
    description: Research each gap with a fresh subagent
    for_each: "{{ steps.understand.gaps }}"
    agent: explorer
    task_name: "{{ item.name }}"
    instruction: >-
      Answer this open question about "{{ steps.understand.title }}" (issue #{{ steps.read_issue.json.number }}): {{ item.question }}
      Look in the code, the docs, the recorded decisions, the issue and its comments, and the git history.
      The brief: {{ steps.understand.brief }}
    output:
      status: {type: string, enum: [resolved, needs_user], description: "needs_user only when nothing that you found answers it."}
      answer: {type: string, description: "The answer, or what you found when it stays open."}
      evidence: {type: string, description: "The files, lines, comments, or commits that support the answer."}
      options: {type: array, items: {type: string}, optional: true, description: "For needs_user: the answers to offer, the recommended one first."}
    next:
      - when: "{{ steps.research_gaps.results | selectattr('status', 'equalto', 'needs_user') | list }}"
        to: ask_user
      - to: write_plan

  ask_user:
    type: decision
    description: Ask the user the questions left open
    decider: human
    instruction: instructions/ask_user.md
    next: write_plan

  write_plan:
    type: task
    description: Write the plan file
    instruction: instructions/write_plan.md
    max_visits: 5
    on_max_visits: stopped
    output:
      summary: {type: string, description: "The plan in a few lines: the approach and the steps."}
    next: approve_plan

  approve_plan:
    type: decision
    description: Ask the user to approve the plan
    decider: human
    instruction: >-
      Show the user the plan file `{{ steps.checkout_base.json.plan_file }}` in full, and ask whether to open the draft
      pull request with it. In short: {{ steps.write_plan.summary }}
    choices:
      approve: Open the draft pull request with this plan, and build it.
      change: Revise the plan with the user's feedback.
      stop: Stop here, with no branch and no pull request.
    output:
      feedback: {type: string, optional: true, description: "What the user wants changed, for the change choice."}
    next: {approve: open_draft_pr, change: write_plan, stop: stopped}

  open_draft_pr:
    type: script
    description: Push the plan on a new branch, and open a draft pull request with it
    run: [uv, run, "{{ skill.dir }}/scripts/open_draft_pr.py"]
    input:
      branch: "{{ steps.checkout_base.json.branch }}"
      base: "{{ steps.checkout_base.json.base }}"
      plan_file: "{{ steps.checkout_base.json.plan_file }}"
      title: "{{ steps.understand.title }}"
      issue: "{{ steps.read_issue.json.number }}"
    parse: json
    next: implement_step

  implement_step:
    type: task
    description: Build one plan step red-green, then push it
    instruction: instructions/implement_step.md
    max_visits: 40
    on_max_visits: write_description
    output:
      behavior: {type: string, description: "The step that this cycle built, in one line."}
      red: {type: string, description: "The failure that the new test showed, or why this cycle has no test."}
      commit: {type: string, description: "The short hash of the pushed commit."}
      plan_update: {type: string, optional: true, description: "What changed in the plan and why, when it changed."}
      done: {type: boolean, description: "true when every plan step and every planned test is built."}
    next:
      - when: "{{ steps.implement_step.done }}"
        to: write_description
      - to: implement_step

  write_description:
    type: task
    description: Write the pull request description
    instruction: instructions/write_description.md
    output:
      summary: {type: string, description: "What the pull request does, in one line."}
    next: review

  review:
    type: call
    description: Run one review round
    skill: review-round
    inputs:
      pr: "{{ steps.open_draft_pr.json.pr_number }}"
      # The commit of the first round (the code that the build left) ends the scope of every round.
      scope_sha: "{{ (history.review | default([]) | map(attribute='outputs') | map(attribute='scope_sha') | first) | default('', true) }}"
      dismissed: "{{ history.resolve | default([]) | map(attribute='outputs') | map(attribute='decisions') | sum(start=[]) | selectattr('verdict', 'equalto', 'dismissed') | selectattr('reviewer') | list }}"
    # The arrow from resolve already limits the loop to 7 rounds. This cap is only a safety net.
    max_visits: 7
    on_max_visits: ready
    next: resolve

  resolve:
    type: call
    description: Resolve the findings and the unaddressed comments
    skill: resolve-pr-feedback
    inputs:
      pr: "{{ steps.open_draft_pr.json.pr_number }}"
      findings: "{{ steps.review.outputs.findings }}"
      scope_sha: "{{ steps.review.outputs.scope_sha }}"
    next:
      # Review again, unless this round fixed nothing, the loop used its 7 rounds, or 4 rounds in total had no
      # required finding.
      - when: >-
          {{ steps.resolve.outputs.fixed > 0
          and (history.resolve | map(attribute='outputs') | selectattr('fixed', 'gt', 0) | list | length) <= 6
          and (history.review | map(attribute='outputs') | map(attribute='findings')
          | map('selectattr', 'severity', 'equalto', 'required') | map('list') | reject | list | length) < 4 }}
        to: review
      - to: ready

  ready:
    type: script
    description: Mark the pull request ready, then remove the plan and push
    run: [uv, run, "{{ skill.dir }}/scripts/mark_ready.py"]
    input: {pr: "{{ steps.open_draft_pr.json.pr_number }}", plan_file: "{{ steps.checkout_base.json.plan_file }}"}
    parse: json
    next: get_ci_green

  get_ci_green:
    type: call
    description: Wait for CI, and fix it until it is green
    skill: fix-ci
    inputs: {pr: "{{ steps.open_draft_pr.json.pr_number }}"}
    max_visits: 7
    on_max_visits: finish
    next: answer_comments

  answer_comments:
    type: call
    description: Resolve the comments that arrived during CI
    skill: resolve-pr-feedback
    inputs: {pr: "{{ steps.open_draft_pr.json.pr_number }}", scope_sha: "{{ steps.review.outputs.scope_sha }}"}
    next: check_unreviewed

  check_unreviewed:
    type: script
    description: Find the code that no review saw yet
    run: [uv, run, "{{ skill.dir }}/scripts/check_unreviewed.py"]
    input:
      pr: "{{ steps.open_draft_pr.json.pr_number }}"
      last_reviewed: "{{ steps.final_review.outputs.reviewed_sha if steps.final_review is defined else steps.review.outputs.reviewed_sha }}"
      plan_file: "{{ steps.checkout_base.json.plan_file }}"
    parse: json
    next:
      - when: "{{ steps.check_unreviewed.json.unreviewed and (history.final_review | default([]) | length) < 5 }}"
        to: final_review
      # Finish when the 5 extra rounds are used, or when nothing is unreviewed and CI ran on the head commit.
      - when: "{{ steps.check_unreviewed.json.unreviewed or steps.check_unreviewed.json.head_sha == steps.get_ci_green.outputs.head_sha }}"
        to: finish
      - to: ready

  final_review:
    type: call
    description: Review the code that no review saw, for required findings only
    skill: review-round
    inputs:
      pr: "{{ steps.open_draft_pr.json.pr_number }}"
      scope_sha: "{{ steps.review.outputs.scope_sha }}"
      since_sha: "{{ steps.final_review.outputs.reviewed_sha if steps.final_review is defined else steps.review.outputs.reviewed_sha }}"
      dismissed: "{{ (history.resolve + (history.final_resolve | default([]))) | map(attribute='outputs') | map(attribute='decisions') | sum(start=[]) | selectattr('verdict', 'equalto', 'dismissed') | selectattr('reviewer') | list }}"
    # The arrow from check_unreviewed already limits these rounds to 5. This cap is only a safety net.
    max_visits: 5
    on_max_visits: finish
    next:
      - when: "{{ (steps.final_review.outputs.findings | selectattr('severity', 'equalto', 'required') | list | length) > 0 }}"
        to: final_resolve
      - to: check_unreviewed

  final_resolve:
    type: call
    description: Fix the required findings of the extra round
    skill: resolve-pr-feedback
    inputs:
      pr: "{{ steps.open_draft_pr.json.pr_number }}"
      findings: "{{ steps.final_review.outputs.findings | selectattr('severity', 'equalto', 'required') | list }}"
      scope_sha: "{{ steps.review.outputs.scope_sha }}"
    next: check_unreviewed

  finish:
    type: task
    description: Add the label when a human must look
    instruction: instructions/finish.md
    output:
      labels: {type: array, items: {type: string}, description: "The labels that you added."}
      reasons: {type: string, description: "Why each label was added, or why none was."}
    next:
      # Each limit that cut work short. The report and finish.md list the same limits.
      - when: "{{ (['implement_step'] if not steps.implement_step.done else []) + (['review'] if steps.resolve.outputs.fixed > 0 and (history.resolve | map(attribute='outputs') | selectattr('fixed', 'gt', 0) | list | length) > 6 else []) + (['get_ci_green'] if (history.ready | length) > (history.get_ci_green | length) else []) + (['final_review'] if steps.check_unreviewed.json.unreviewed else []) + (['resolve_items'] if (history.resolve + history.answer_comments + history.final_resolve) | selectattr('status', 'equalto', 'failed') | list else []) }}"
        to: capped
      - to: done

  done:
    type: end
    description: The pull request is ready
    status: succeeded
    outputs: {result: implemented, pr_number: "{{ steps.open_draft_pr.json.pr_number }}", pr_url: "{{ steps.open_draft_pr.json.pr_url }}"}
    report: instructions/report.md

  capped:
    type: end
    description: The pull request exists, but a limit cut work short
    status: failed
    outputs:
      result: capped
      pr_number: "{{ steps.open_draft_pr.json.pr_number }}"
      pr_url: "{{ steps.open_draft_pr.json.pr_url }}"
      limits: "{{ (['implement_step'] if not steps.implement_step.done else []) + (['review'] if steps.resolve.outputs.fixed > 0 and (history.resolve | map(attribute='outputs') | selectattr('fixed', 'gt', 0) | list | length) > 6 else []) + (['get_ci_green'] if (history.ready | length) > (history.get_ci_green | length) else []) + (['final_review'] if steps.check_unreviewed.json.unreviewed else []) + (['resolve_items'] if (history.resolve + history.answer_comments + history.final_resolve) | selectattr('status', 'equalto', 'failed') | list else []) }}"
    report: instructions/report.md

  held:
    type: end
    description: The work must not start
    status: cancelled
    outputs: {result: held}
    report: >-
      Tell the user why the work did not start: {% if steps.understand is defined %}{{ steps.understand.blocker }}{% else %}issue
      #{{ steps.read_issue.json.number }} {{ steps.read_issue.json.hold_reason }}{% endif %}.

  stopped:
    type: end
    description: The work stopped before any pull request
    status: cancelled
    outputs: {result: stopped}
    report: >-
      Tell the user that the work stopped before any branch or pull request:
      {% if steps.write_plan is defined %}the plan was not approved. The plan file `{{ steps.checkout_base.json.plan_file }}`
      stays in the checkout, not committed: keep it or delete it.
      {% elif steps.checkout_base is defined %}{{ steps.checkout_base.json.reason }}
      {% elif steps.checkout_default is defined %}{{ steps.checkout_default.json.reason }}
      {% else %}no issue was filed for the request.{% endif %}
