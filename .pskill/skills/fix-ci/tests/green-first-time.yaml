name: checks that pass the first time need no fix
inputs: {pr: 9}
calls:
  checkout:
    - {status: succeeded, outputs: {branch: 42-fix-save, base: main, head_sha: c1, plan_file: implementation-plan-api-key-copy-button.md}}
scripts:
  wait_ci:
    - {exit_code: 0, stdout: '{"state": "passed", "failed_checks": [], "head_sha": "c2"}'}
expect:
  path: [checkout, wait_ci, passed]
  status: succeeded
  outputs: {state: passed, failed_checks: [], head_sha: c2, fixes: 0}
