name: a failure that the pull request caused gets a fix, and the next checks pass
inputs: {pr: 9}
calls:
  checkout:
    - {status: succeeded, outputs: {branch: 42-fix-save, base: main, head_sha: c1, plan_file: implementation-plan-api-key-copy-button.md}}
answers:
  wait_ci:
    - {state: failed, failed_checks: ["tests (ubuntu): https://x/1"], head_sha: c2}
    - {state: passed, failed_checks: [], head_sha: c3}
  fix_ci:
    - {cause: this_pr, summary: A fixture expected one call.}
expect:
  path: [checkout, wait_ci, fix_ci, wait_ci, passed]
  status: succeeded
  outputs: {state: passed, failed_checks: [], head_sha: c3, fixes: 1}
