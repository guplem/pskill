<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- pskill: a skill is a line of steps, and the runner gives the agent one step at a time.
       Done (white), now (orange), and to do (a ring): the colors of the viewer. -->
  <rect width="32" height="32" rx="7" fill="#2f6fde"/>
  <path d="M16 6v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="6" r="2.75" fill="#fff"/>
  <circle cx="16" cy="16" r="4.25" fill="#f5a524"/>
  <circle cx="16" cy="26" r="2.5" fill="#2f6fde" stroke="#fff" stroke-width="1.75"/>
</svg>
