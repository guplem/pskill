<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pskill viewer</title>
    <!-- Two fonts from Google Fonts. Offline, style.css falls back to the system fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- Mermaid lays out the skill graph. It comes from a CDN, pinned to one version (SPEC.md section 14).
         Offline, the page still works: the canvas shows the steps as a list instead. -->
    <script
      src="https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js"
      integrity="sha384-xzghz1GQ5u9HCpVskeDPqMsdogD1yvuMQbEK53+wi+G70+6J1AG0L2cfi9PHjDWI"
      crossorigin="anonymous"
    ></script>
    <!-- ELK (Mermaid's layout-elk package) lays the graph out top to bottom and keeps its main line straight.
         It loads on the first graph, pinned with a hash per file. Without it, Mermaid's own layout draws the graph. -->
    <script type="importmap">
      {
        "imports": {
          "mermaid-layout-elk": "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/mermaid-layout-elk.esm.min.mjs"
        },
        "integrity": {
          "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/mermaid-layout-elk.esm.min.mjs": "sha384-rn9t+ppxHcyMkuY3+pP6SuTi31DepbscPnhCa8S03c+vuNBBFSC4Wv0W8hTUwJRe",
          "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/chunks/mermaid-layout-elk.esm.min/chunk-SP2CHFBE.mjs": "sha384-4u/55YQqYu4r82l3QSG2BuK71vzbS71A5BaqSgNzcAI4q0Vr/wW1QxkYuOYxHoZa",
          "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/chunks/mermaid-layout-elk.esm.min/elk-MDRY34D3.mjs": "sha384-lzyZYy6UyW1tCfryPlf//IE3a6OLFKNuc4C7kjKONQJ6jNJ8/OSkcjrIHU4rZkLf",
          "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/chunks/mermaid-layout-elk.esm.min/katex-ACDNIZYF.mjs": "sha384-y2PCy0bynu711oZLMNcYWFvN49h8rAchXNhJOqTQWlAeSlHvE4Zx9BweM9Og1Fqg",
          "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/chunks/mermaid-layout-elk.esm.min/sizeCapture-YC7IFIKW.mjs": "sha384-0YuCfvrJ1Eb3NN7+RpyLpsrVjQiyRPeZZEuOfi7gqi2OGiPs6EYsjLEXBWArjhRD"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="app" class="loading">Loading…</div>
  </body>
</html>
