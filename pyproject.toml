[project]
name = "pskill"
version = "0.32.0"
description = "Portable programmatic skills: run agent skills as typed YAML graphs, one block at a time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Keep this list equal to the PEP 723 block in pskill.py (a test checks it).
dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "pyyaml>=6",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-jsonschema",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# `uv run pytest --cov` (CI) measures lines and branches and fails below 100%. A line that no input can reach
# carries `# pragma: no cover` (or `no branch`) with its reason; nothing else may be left out.
[tool.coverage.run]
source = ["pskill_runner"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
# The vendored copy in .pskill/ equals the sources byte for byte (tests/test_vendoring.py checks it).
extend-exclude = ["*.md", ".pskill/pskill.py", ".pskill/pskill_runner"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pskill.py", "pskill_runner", "tests", ".pskill/skills/*/scripts"]
